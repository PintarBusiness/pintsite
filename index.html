<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="izdelava spletnih strani, spletne strani, web design, SEO, PintSite">

  <!-- Open Graph (za social media) -->

  <meta property="og:description" content="Modern design, hitrost in SEO optimizacija za tvojo spletno stran.">

  <!-- Twitter -->

  <!-- FAVICON -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <!-- GOOGLE FONTS (modern, clean) -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FONT AWESOME -->

  <!-- CSS -->

</head>

<body>

    <!-- HEADER -->
    <header class="header" id="header">
    <div class="header-inner">

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <img src="Logopravitext.png" alt="PintSite Logo">
        </a>

        <!-- CENTER WRAP -->
        <div class="header-center" id="header-center">
            <nav class="nav" id="nav">
            <a href="index.html">Domov</a>
            <a href="reference.html">Reference</a>
            <a href="storitve.html">Storitve</a>
            <a href="cenik.html">Cenik</a>
            <a href="onas.html">O nas</a>
            </nav>

            <a href="kontakt.html" class="cta-btn">
            Pošlji povpraševanje
            </a>
        </div>

        <!-- MOBILE -->
        <div class="menu-toggle" id="menu-toggle" aria-label="Odpri meni" aria-expanded="false" aria-controls="header-center">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
    </header>

    <!-- HEADER SCRIPT -->
    <script>
        const toggle = document.getElementById("menu-toggle");
        const headerCenter = document.getElementById("header-center");
        const header = document.getElementById("header");

        toggle.addEventListener("click", () => {
        headerCenter.classList.toggle("active");
        toggle.classList.toggle("active");

        const isOpen = headerCenter.classList.contains("active");
        toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
            header.classList.add("scrolled");
        } else {
            header.classList.remove("scrolled");
        }
        });
    </script>

</body>
</html>
